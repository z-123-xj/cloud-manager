<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>云管平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>" />
  <script src="/assets/js/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css?v=20261110b" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8/lib/xterm-addon-fit.js"></script>
  <!-- 字体与图标库（DeepSeek 风格：Inter + Font Awesome） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="app">
    <!-- ============ 登录页面 ============ -->
    <div v-if="!isLoggedIn" class="login-page">
      <header class="login-header">
        <div class="login-brand">☁️ 云管平台</div>
      </header>
      <div class="login-main">
        <div class="login-card">
          <h2 class="login-card-title">登录账号</h2>
          <form @submit.prevent="handleLogin" class="login-form">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" class="input input-full" ref="usernameInput" v-model="loginForm.username" placeholder="请输入用户名" autocomplete="off" readonly @focus="(e)=>e.target.removeAttribute('readonly')" @keydown.enter.prevent="passwordInput && passwordInput.focus()" />
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" class="input input-full" ref="passwordInput" v-model="loginForm.password" placeholder="请输入密码（至少6位）" autocomplete="off" readonly @focus="(e)=>e.target.removeAttribute('readonly')" minlength="6" @keydown.enter.prevent="captchaInput && captchaInput.focus()" />
          </div>
          <div class="form-group login-captcha-row">
            <input type="text" class="input" ref="captchaInput" v-model="loginForm.captcha" placeholder="请输入验证码" maxlength="4" autocomplete="off" style="flex:1; text-transform:uppercase" @keydown.enter.prevent="handleLogin()" />
            <img :src="captchaImg" @click="refreshCaptcha" class="login-captcha-img" title="点击刷新验证码" alt="验证码" />
          </div>
          <div class="login-error" v-if="loginError">{{ loginError }}</div>
          <button type="submit" class="btn btn-primary btn-full" :disabled="loginLoading">
            {{ loginLoading ? '登录中...' : '登 录' }}
          </button>
        </form>
        </div>
      </div>
    </div>

    <!-- ============ 主页面（登录后） ============ -->
    <template v-if="isLoggedIn">
      <div class="layout">
        <!-- 顶部横栏：左侧产品名，右侧用户管理/云平台账号/圆形头像下拉抽屉 -->
        <header class="topbar" :class="{ collapsed: sidebarCollapsed }">
          <div class="topbar-left">
            <button class="ali-menu-btn" @click="drawerOpen = !drawerOpen" :title="drawerOpen ? '关闭导航抽屉' : '展开导航抽屉'"><span v-if="drawerOpen">✕</span><span v-else>☰</span></button>
            <span class="ali-brand">云管平台</span>
            <a class="ali-workbench-btn" :class="{ active: currentTab === 'home' }" :href="'/'" @click="navigate($event, '/')">⚙ 工作台</a>
            <span class="page-title"><i class="fas" :class="currentPageIcon"></i> {{ currentPageTitle }}</span>
          </div>
          <div class="topbar-center">
            <div class="ali-global-search" :class="{ open: globalSearchOpen }" @click.stop>
              <div class="ali-global-search-box">
                <i class="fas fa-search"></i>
                <input ref="globalSearchInput" class="ali-global-search-input" type="text"
                       v-model="globalSearchKeyword" placeholder="搜索产品、服务或功能"
                       autocomplete="off" spellcheck="false"
                       @focus="openGlobalSearch" @input="openGlobalSearch" @keydown="onGlobalSearchKey" />
                <button v-if="globalSearchKeyword" class="ali-global-search-clear" type="button" title="清空" @click="clearGlobalSearch">✕</button>
                <span v-else class="ali-global-search-kbd">Ctrl K</span>
              </div>
              <div class="ali-global-search-panel" v-if="globalSearchOpen">
                <div class="ali-global-search-panel-head">{{ globalSearchKeyword.trim() ? '搜索结果' : '常用入口' }}</div>
                <a class="ali-global-search-item" v-for="(item, idx) in globalSearchResults" :key="item.path"
                   :class="{ active: globalSearchActive === idx }"
                   @click="goGlobalSearch(item)" @mouseenter="globalSearchActive = idx">
                  <i class="fas fa-external-link-alt"></i>
                  <span>{{ item.label }}</span>
                  <span class="group">{{ item.group }}</span>
                </a>
                <div class="ali-global-search-empty" v-if="!globalSearchResults.length">没有匹配的产品或服务</div>
              </div>
            </div>
          </div>
          <div class="topbar-right">
            <a class="topbar-link" :class="{ active: currentTab === 'users' }" :href="'/assets/pages/users.html'" @click.prevent="goTab('/assets/pages/users.html')" v-if="isAdmin" title="用户管理">用户管理</a>
            <a class="topbar-link" :class="{ active: currentTab === 'accounts' }" :href="'/assets/pages/accounts.html'" @click.prevent="goTab('/assets/pages/accounts.html')" v-if="isAdmin" title="云平台账号">云平台账号</a>
            <div class="topbar-avatar-wrap" @click.stop="profileMenuOpen = !profileMenuOpen" title="个人中心">
              <div class="topbar-avatar">{{ avatarText }}</div>
              <span class="topbar-avatar-arrow" :class="{ open: profileMenuOpen }">▾</span>
              <div class="topbar-dropdown" v-if="profileMenuOpen" @click.stop>
                <div class="topbar-dropdown-head">
                  <div class="topbar-dropdown-name">{{ username }}</div>
                  <div class="topbar-dropdown-role">{{ userRoleLabel(userRole) }}</div>
                </div>
                <a class="topbar-dropdown-item" @click="openProfile">个人资料</a>
                <a class="topbar-dropdown-item" @click="openChangePassword">修改密码</a>
                <div class="topbar-dropdown-divider"></div>
                <a class="topbar-dropdown-item danger" @click="logout">退出登录</a>
              </div>
            </div>
          </div>
        </header>
        <!-- 侧边栏（结构对齐 1.html：分组 + nav-link + submenu，折叠只留图标；图标用 3.html 的 SVG） -->
        <aside class="sidebar" :class="{ collapsed: sidebarCollapsed }">
          <a class="sidebar-logo" @click="navigate('/')" title="云管平台">
            <svg class="logo-icon" viewBox="0 0 24 24"><path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.1325 20.1647 10.1928 17.8371 10.0209C17.4106 6.59986 14.5143 4 11 4C7.13401 4 4 7.13401 4 11C4 11.1522 4.00486 11.3035 4.01445 11.4536C2.25911 12.0377 1 13.7015 1 15.6667C1 18.0609 2.93908 20 5.33333 20H17.5V19Z"/></svg>
            <span>云管平台</span>
          </a>
          <nav class="sidebar-nav">
            <!-- 主导航 -->
            <div class="menu-section">
              <div class="menu-section-title">主导航</div>
              <ul class="nav-list">
                <li class="nav-item">
                  <a class="nav-link" :class="{ active: currentTab === 'home' }" :href="'/'" @click="navigate($event, '/')" title="首页">
                    <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
                    <span class="link-text">首页</span>
                  </a>
                </li>
              </ul>
            </div>
            <!-- 域名服务 -->
            <div class="menu-section">
              <div class="menu-section-title">域名服务</div>
              <ul class="nav-list">
                <li class="nav-item" :class="{ open: sidebarDomainOpen }">
                  <a class="nav-link" @click="sidebarDomainOpen = !sidebarDomainOpen" title="域名">
                    <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg></span>
                    <span class="link-text">域名</span>
                    <span class="arrow" :class="{ open: sidebarDomainOpen }">▶</span>
                  </a>
                  <ul class="submenu" v-show="sidebarDomainOpen">
                    <li><a class="submenu-link" :class="{ active: currentTab === 'domains' }" :href="'/assets/pages/domains.html'" @click.prevent="goTab('/assets/pages/domains.html')" title="域名管理"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></span>域名管理</a></li>
                    <li><a class="submenu-link" :class="{ active: currentTab === 'dnsDomains' }" :href="'/assets/pages/dns.html'" @click.prevent="goTab('/assets/pages/dns.html')" title="DNS解析"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zM4 17v-2h16v2H4zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM4 7V5h16v2H4z"/></svg></span>DNS解析</a></li>
                    <li><a class="submenu-link" :class="{ active: currentTab === 'cdnDomains' }" :href="'/assets/pages/cdn.html'" @click.prevent="goTab('/assets/pages/cdn.html')" title="CDN域名"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg></span>CDN域名</a></li>
                  </ul>
                </li>
              </ul>
            </div>
            <!-- 计算 -->
            <div class="menu-section">
              <div class="menu-section-title">计算</div>
              <ul class="nav-list">
                <li class="nav-item" :class="{ open: sidebarServerOpen }">
                  <a class="nav-link" @click="sidebarServerOpen = !sidebarServerOpen" title="服务器">
                    <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></span>
                    <span class="link-text">服务器</span>
                    <span class="arrow" :class="{ open: sidebarServerOpen }">▶</span>
                  </a>
                  <ul class="submenu" v-show="sidebarServerOpen">
                    <li><a class="submenu-link" :class="{ active: currentTab === 'ecs' }" :href="'/assets/pages/ecs.html'" @click.prevent="goTab('/assets/pages/ecs.html')" title="实例列表"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M2 20h20v-4H2v4zm2-3h2v2H4v-2zM2 4v4h20V4H2zm4 3H4V5h2v2zm-4 7h20v-4H2v4zm4-3H4v2h2v-2z"/></svg></span>实例列表</a></li>
                    <li><a class="submenu-link" :class="{ active: currentTab === 'regions' }" :href="'/assets/pages/regions.html'" @click.prevent="goTab('/assets/pages/regions.html')" title="实例地域开通"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></span>实例地域开通</a></li>
                  </ul>
                </li>
              </ul>
            </div>
            <!-- 资源 -->
            <div class="menu-section">
              <div class="menu-section-title">资源</div>
              <ul class="nav-list">
                <li class="nav-item" :class="{ open: sidebarResourceOpen }">
                  <a class="nav-link" @click="sidebarResourceOpen = !sidebarResourceOpen" title="资源">
                    <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg></span>
                    <span class="link-text">资源</span>
                    <span class="arrow" :class="{ open: sidebarResourceOpen }">▶</span>
                  </a>
                  <ul class="submenu" v-show="sidebarResourceOpen">
                    <li><a class="submenu-link" :class="{ active: currentTab === 'resourcePackages' }" :href="'/assets/pages/resource-packages.html'" @click.prevent="goTab('/assets/pages/resource-packages.html')" title="资源包"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1 0-2 .9-2 2v3.01h2V4h16v3.01h2V4c0-1.1-1-2-2-2zM2 18c0 1.1 1 2 2 2h16c1 0 2-.9 2-2V7H2v11zM13 9l1 1 3-3-1-1-3 3zM3 13h8v2H3v-2zm0 4h8v2H3v-2zm10 0h8v2h-8v-2zm0-4h8v2h-8v-2z"/></svg></span>资源包</a></li>
                  </ul>
                </li>
              </ul>
            </div>
            <!-- 安全运维 -->
            <div class="menu-section" v-if="bastionEnabled">
              <div class="menu-section-title">安全运维</div>
              <ul class="nav-list">
                <li class="nav-item" :class="{ open: sidebarBastionOpen }">
                  <a class="nav-link" @click="sidebarBastionOpen = !sidebarBastionOpen" title="堡垒机">
                    <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></span>
                    <span class="link-text">堡垒机</span>
                    <span class="arrow" :class="{ open: sidebarBastionOpen }">▶</span>
                  </a>
                  <ul class="submenu" v-show="sidebarBastionOpen">
                    <li><a class="submenu-link" :class="{ active: currentTab === 'bastionGroups' }" :href="'/bastion/groups'" @click="navigate($event, '/bastion/groups')" v-if="isAdmin" title="用户组"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>用户组</a></li>
                    <li><a class="submenu-link" :class="{ active: currentTab === 'bastionCredentials' }" :href="'/bastion/credentials'" @click="navigate($event, '/bastion/credentials')" v-if="isAdmin" title="凭证"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg></span>凭证</a></li>
                    <li><a class="submenu-link" :href="'/assets/pages/batch-exec.html'" @click.prevent="goTab('/assets/pages/batch-exec.html')" title="批量执行"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>批量执行</a></li>
                    <li><a class="submenu-link" href="/assets/pages/logs.html?v=20261108i" title="日志排查"><span class="sub-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>日志排查</a></li>
                  </ul>
                </li>
              </ul>
            </div>
          </nav>
        </aside>

        <!-- 主体内容 -->
        <main class="main-content">

          <!-- ========== 首页 ========== -->
          <template v-if="currentTab === 'home'">
            <div class="page-header">
              <h2>工作台</h2>
              <span class="wb-hero-status" :class="homeStats.backendAlive ? 'ok' : 'bad'">
                <span class="dot" :class="homeStats.backendAlive ? 'dot-online' : 'dot-danger'"></span>
                {{ homeStats.backendAlive ? '服务运行正常' : '后台服务不可用' }}
              </span>
            </div>

            <div class="wb-hero">
              <div class="wb-hero-text">
                <div class="wb-hero-title">我的资源</div>
                <div class="wb-hero-desc">资源总览与快捷入口 · 点击左上角 ☰ 打开全部产品与服务</div>
              </div>
            </div>

            <div class="wb-blocks">
              <div class="wb-block">
                <div class="wb-block-title">最近访问 <a @click="drawerCategory = 'all'; drawerOpen = true">查看更多</a></div>
                <div class="wb-chips">
                  <a class="wb-chip" v-for="v in recentVisits" :key="v.path" @click="goTab(v.path)">{{ v.name }}</a>
                </div>
              </div>
              <div class="wb-block">
                <div class="wb-block-title">我的收藏</div>
                <div class="wb-chips">
                  <a class="wb-chip" v-for="v in favorites" :key="v.path" @click="goTab(v.path)">{{ v.name }}</a>
                </div>
              </div>
            </div>

            <div class="wb-block wb-block-actions">
              <div class="wb-block-title">常用操作</div>
              <div class="wb-chips">
                <a class="wb-chip" @click="navigate('/domains'); setTimeout(() => syncDomains(), 100)">同步域名</a>
                <a class="wb-chip" @click="goTab('/assets/pages/ecs.html')">同步ECS</a>
                <a class="wb-chip" @click="drawerCategory = 'all'; drawerOpen = true">全部产品与服务</a>
              </div>
            </div>

            <div class="wb-group" v-for="g in workbenchGroups" :key="g.key">
              <div class="wb-group-head"><i class="ali-group-icon" :class="g.icon"></i>{{ g.title }}</div>
              <div class="wb-group-grid">
                <a class="wb-res-card" v-for="item in g.items" :key="g.key + item.label" @click="goTab(item.path)">
                  <span class="wb-res-title">{{ item.label }} <span class="ali-arrow">›</span></span>
                  <span class="wb-res-meta">{{ item.count }}</span>
                </a>
              </div>
            </div>

            <div class="home-cards">
              <div class="home-card" @click="navigate('/domains')">
                <div class="home-card-icon">🌐</div>
                <div class="home-card-info">
                  <div class="home-card-value">{{ homeStats.domainTotal }}</div>
                  <div class="home-card-label">域名总数</div>
                </div>
                <div class="home-card-detail">
                  <div class="home-detail-row"><span class="dot dot-online"></span>在线 {{ homeStats.domainOnline }}</div>
                  <div class="home-detail-row"><span class="dot dot-warning"></span>即将到期 {{ homeStats.domainExpiring }}</div>
                  <div class="home-detail-row"><span class="dot dot-danger"></span>已过期 {{ homeStats.domainExpired }}</div>
                </div>
              </div>

              <div class="home-card" style="cursor:pointer;" @click="goTab('/assets/pages/ecs.html')">
                <div class="home-card-icon">💻</div>
                <div class="home-card-info">
                  <div class="home-card-value">{{ homeStats.ecsTotal }}</div>
                  <div class="home-card-label">ECS实例总数</div>
                </div>
                <div class="home-card-detail">
                  <div class="home-detail-row"><span class="dot dot-online"></span>运行中 {{ homeStats.ecsOnline }}</div>
                  <div class="home-detail-row"><span class="dot dot-offline"></span>已停止 {{ homeStats.ecsOffline }}</div>
                </div>
              </div>

              <div class="home-card">
                <div class="home-card-icon">☁️</div>
                <div class="home-card-info">

            <div class="ali-drawer-rail-title">产品与服务</div>

            <button class="btn-close" @click="detailVisible = false">&times;</button>
          </div>
          <div class="modal-body" v-if="detail">
            <div class="detail-grid">
              <div class="detail-item"><label>域名</label><span class="detail-value domain">{{ detail.domain_name }}</span></div>
              <div class="detail-item"><label>平台</label><span>{{ detail.platform }}</span></div>
              <div class="detail-item"><label>账号</label><span>{{ detail.account_name }}（{{ detail.account_id }}）</span></div>
              <div class="detail-item"><label>所有者</label><span>{{ detail.owner || '-' }}</span></div>
              <div class="detail-item"><label>注册日期</label><span>{{ formatDate(detail.registration_date) }}</span></div>
              <div class="detail-item"><label>到期日期</label><span>{{ formatDate(detail.expiration_date) }}</span></div>
              <div class="detail-item"><label>剩余天数</label><span :class="getDaysClass(detail.expiration_days_left)">{{ detail.expiration_days_left }} 天</span></div>
              <div class="detail-item"><label>到期状态码</label><span>{{ detail.expiration_status_code || '-' }}</span></div>
              <div class="detail-item"><label>自动续费</label><span>{{ detail.auto_renew_enabled ? '已开启' : '未开启' }}</span></div>
              <div class="detail-item"><label>状态</label>
                <span v-if="detail.is_offline === 1" class="tag tag-offline">已下线</span>

      <!-- DNS记录添加/编辑右侧抽屉 -->
      <div class="drawer-overlay" v-if="dnsFormVisible"></div>
      <div class="drawer" :class="{ 'drawer-open': dnsFormVisible }">
        <div class="drawer-header">
          <h2>{{ dnsFormEditing ? '编辑记录' : '添加记录' }}</h2>
          <button class="btn-close" @click="dnsFormVisible = false">&times;</button>
        </div>
        <div class="drawer-body">
          <!-- 记录类型 -->
          <div class="dns-form-group">
            <label>记录类型</label>
            <div class="dns-type-select">
              <!-- Cloudflare：完整记录类型（与 CF 面板一致） -->
              <select class="select" style="width:100%" v-model="dnsForm.type" v-if="dnsCurrentPlatform === 'cloudflare'">
                <option value="A">A -- 将域名指向一个IPv4地址</option>
                <option value="AAAA">AAAA -- 将域名指向一个IPv6地址</option>
                <option value="CAA">CAA -- 证书授权记录</option>
                <option value="CERT">CERT -- 证书记录</option>
                <option value="CNAME">CNAME -- 将域名指向另一个域名</option>
                <option value="DNSKEY">DNSKEY -- DNSSEC 密钥记录</option>
                <option value="DS">DS -- DNSSEC 委派记录</option>
                <option value="HTTPS">HTTPS -- HTTPS 服务记录</option>
                <option value="LOC">LOC -- 地理位置记录</option>
                <option value="MX">MX -- 将域名指向邮件服务器</option>
                <option value="NAPTR">NAPTR -- 名称权威指针记录</option>
                <option value="NS">NS -- 子域名DNS服务器</option>
                <option value="OPENPGPKEY">OPENPGPKEY -- OpenPGP 公钥记录</option>
                <option value="PTR">PTR -- 反向解析记录</option>
                <option value="SMIMEA">SMIMEA -- S/MIME 证书记录</option>
                <option value="SRV">SRV -- 服务定位记录</option>
                <option value="SSHFP">SSHFP -- SSH 密钥指纹记录</option>
                <option value="SVCB">SVCB -- 服务绑定记录</option>
                <option value="TLSA">TLSA -- TLS 证书绑定记录</option>
                <option value="TXT">TXT -- 文本记录</option>
                <option value="URI">URI -- URI 重定向记录</option>
              </select>
              <!-- 阿里云 / 腾讯云 -->
              <select class="select" style="width:100%" v-model="dnsForm.type" v-else>
                <option value="A">A -- 将域名指向一个IPv4地址</option>
                <option value="AAAA">AAAA -- 将域名指向一个IPv6地址</option>
                <option value="CNAME">CNAME -- 将域名指向另一个域名</option>
                <option value="MX">MX -- 将域名指向邮件服务器</option>
                <option value="TXT">TXT -- 文本记录</option>
                <option value="NS">NS -- 子域名DNS服务器</option>
                <option value="SRV">SRV -- 服务定位记录</option>
                <option value="CAA">CAA -- 证书授权记录</option>
                <option value="PTR">PTR -- 反向解析记录</option>
                <option value="显性URL">显性URL -- 301重定向</option>
                <option value="隐性URL">隐性URL -- iframe转发</option>
              </select>
            </div>
            <div class="form-hint" style="margin-top:6px;font-size:12px;color:#999;">
              <template v-if="dnsCurrentPlatform === 'cloudflare' && ['SRV','LOC','HTTPS','SVCB','NAPTR'].includes(dnsForm.type)">该类型为结构化记录，请直接在 Cloudflare 面板配置</template>
              <template v-else-if="dnsForm.type === 'A'">A记录的记录值为IPv4形式（如10.10.10.10）</template>
              <template v-else-if="dnsForm.type === 'AAAA'">AAAA记录的记录值为IPv6形式</template>
              <template v-else-if="dnsForm.type === 'CNAME'">CNAME记录的记录值为域名形式（如example.com）</template>
              <template v-else-if="dnsForm.type === 'MX'">MX记录的记录值为邮件服务器域名</template>
              <template v-else-if="dnsForm.type === 'TXT'">TXT记录的记录值为任意文本</template>
              <template v-else-if="dnsForm.type === 'NS'">NS记录的记录值为DNS服务器域名</template>
              <template v-else-if="dnsForm.type === '显性URL' || dnsForm.type === '隐性URL'">URL记录的记录值为http(s)://开头的完整网址</template>
              <template v-else>请输入对应的记录值</template>
            </div>
          </div>

          <!-- 主机记录 -->
          <div class="dns-form-group">
            <label>主机记录</label>
            <div class="dns-input-wrap">
              <input type="text" class="input" v-model="dnsForm.rr" placeholder="如 www、@、*" style="border-radius:6px 0 0 6px;" />
              <span class="dns-domain-suffix">.{{ dnsForm.domain_name }}</span>
            </div>
          </div>

          <!-- 代理状态（Cloudflare 橙云，仅 A/AAAA/CNAME 支持） -->
          <div class="dns-form-group" v-if="dnsCurrentPlatform === 'cloudflare' && ['A','AAAA','CNAME'].includes(dnsForm.type)">
            <label>代理状态</label>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-weight:normal;">
                <input type="checkbox" v-model="dnsForm.proxied" style="width:16px;height:16px;accent-color:#f6821f;cursor:pointer" />
                <span :style="{ color: dnsForm.proxied ? '#f6821f' : '#64748b', fontWeight: dnsForm.proxied ? 600 : 400 }">{{ dnsForm.proxied ? '已代理' : '仅DNS' }}</span>
              </label>
              <span class="form-hint" style="font-size:12px;color:#999;">开启后流量经过 Cloudflare CDN（橙云），隐藏真实 IP；仅 A/AAAA/CNAME 支持</span>
            </div>
          </div>

          <!-- 解析请求来源（仅阿里云/腾讯云有线路概念；Cloudflare/AWS 隐藏） -->
          <div class="dns-form-group" v-if="dnsCurrentPlatform === 'aliyun' || dnsCurrentPlatform === 'tencent'">
            <label>解析请求来源</label>
            <div style="display:flex; gap:16px; align-items:center;">
              <label style="display:flex; align-items:center; gap:4px; cursor:pointer; font-weight:normal; font-size:14px;">
                <input type="radio" v-model="dnsForm.line_type" value="default" /> 默认
              </label>
              <label style="display:flex; align-items:center; gap:4px; cursor:pointer; font-weight:normal; font-size:14px;">
                <input type="radio" v-model="dnsForm.line_type" value="region" /> 运营商
              </label>
              <template v-if="dnsForm.line_type === 'region'">
                <select class="select select-sm" v-model="dnsForm.line">
                  <option value="internal">中国地区</option>
                  <option value="oversea">境外</option>
                </select>
              </template>
            </div>
          </div>

          <!-- 记录值（始终可见，不在折叠框内） -->
          <div class="dns-form-group">
            <label>记录值 <span class="required">*</span></label>
            <div class="form-hint" style="margin-bottom:8px;font-size:12px;color:#64748b;">
              {{ getDnsValueHint(dnsForm.type) }}
            </div>
            <!-- 权重模式：单行记录值输入 -->
            <template v-if="dnsForm.load_balance === 'weight'">
              <input type="text" class="input input-full" :class="dnsValueValid === false ? 'input-error' : (dnsForm.value && dnsValueValid === true ? 'input-success' : '')"
                v-model="dnsForm.value" :placeholder="getDnsValuePlaceholder(dnsForm.type)"
                @input="dnsValueValid = validateDnsValue(dnsForm.type, dnsForm.value)" />
              <div class="form-hint" style="margin-top:4px;font-size:12px;" v-if="dnsForm.value && dnsValueValid === false" :style="{color:'#ea4335'}">
                ❌ 格式错误：{{ getDnsValueError(dnsForm.type) }}
              </div>
            </template>
            <!-- 轮询模式：多行记录值表格（仅阿里云/腾讯云） -->
            <template v-if="dnsForm.load_balance === 'round_robin' && dnsCurrentPlatform !== 'cloudflare' && dnsCurrentPlatform !== 'aws'">
              <table class="dns-record-table">
                <thead>
                  <tr>
                    <th style="width:40%">记录值</th>
                    <th style="width:22%">状态</th>
                    <th>备注</th>
                    <th style="width:50px">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="(val, idx) in roundRobinValues" :key="idx">
                    <td><input type="text" class="input" :class="val.value && dnsValidateRoundRobinValue(val.value) === false ? 'input-error' : ''" v-model="val.value" :placeholder="getDnsValuePlaceholder(dnsForm.type)" :style="{width:'100%'}" /></td>
                    <td>
                      <select class="select select-sm" v-model="val.status" style="width:100%">
                        <option value="ENABLE">启用</option>
                        <option value="DISABLE">禁用</option>
                      </select>
                    </td>
                    <td><input type="text" class="input" v-model="val.remark" placeholder="备注" :style="{width:'100%'}" /></td>
                    <td><button class="btn btn-text btn-sm" style="color:#ea4335" @click="removeRoundRobinValue(idx)">删除</button></td>
                  </tr>
                </tbody>
              </table>
              <div class="dns-add-record-row">
                <button class="btn-link" @click="addRoundRobinValue">+ 添加记录值</button>
              </div>
            </template>
          </div>

          <!-- TTL / 负载策略 / MX优先级（高级配置） -->
          <div class="dns-collapse-panel" :class="{ expanded: dnsCollapseOpen }">
            <div class="dns-collapse-header" @click="dnsCollapseOpen = !dnsCollapseOpen">
              <span class="collapse-arrow" :class="{ open: dnsCollapseOpen }">▶</span>
              <span class="collapse-title">TTL时间 / 负载策略 / MX优先级（高级配置）</span>
            </div>
            <div class="dns-collapse-body" :class="{ open: dnsCollapseOpen }">
              <!-- TTL时间 -->
              <div class="dns-form-group">
                <label>TTL时间</label>

                </h4>
                <div class="table-wrapper" style="max-height:200px;overflow-y:auto">
                  <table class="table"><thead><tr><th style="width:36px"><input type="checkbox" @change="onToggleAllBastionCreds" :checked="bastionGroupCredRemoveIds.length && bastionGroupCredRemoveIds.length === bastionGroupCredList.length" /></th><th>凭证名称</th><th>用户名</th><th>认证方式</th></tr></thead>
                  <tbody>
                    <tr v-if="bastionGroupCredList.length === 0"><td colspan="4" class="text-center py-20 text-gray">暂无授权凭证</td></tr>
                    <tr v-for="c in bastionGroupCredList" :key="c.id">
                      <td><input type="checkbox" :value="c.id" v-model="bastionGroupCredRemoveIds" /></td>
                      <td>{{ c.credential_name }}</td>
                      <td>{{ c.username }}</td>
                      <td><span class="tag tag-xs" :class="c.auth_type==='password'?'tag-success':'tag-platform'">{{ c.auth_type==='password'?'密码':'私钥' }}</span></td>
                    </tr>
                  </tbody></table>
                </div>
              </div>
              <!-- 添加凭证授权 -->
              <div>
                <h4 style="margin:0 0 8px 0">添加凭证授权</h4>
                <div class="table-wrapper" style="max-height:200px;overflow-y:auto;margin-bottom:8px">
                  <table class="table"><thead><tr><th style="width:36px"><input type="checkbox" @change="onToggleAllAvailableCreds" :checked="bastionGroupCredNewIds.length && bastionGroupCredNewIds.length === filteredAvailableCreds.length" /></th><th>凭证名称</th><th>用户名</th><th>认证方式</th></tr></thead>
                  <tbody>
                    <tr v-if="filteredAvailableCreds.length === 0"><td colspan="4" class="text-center py-20 text-gray">所有凭证已授权</td></tr>
                    <tr v-for="c in filteredAvailableCreds" :key="c.id">
                      <td><input type="checkbox" :value="c.id" v-model="bastionGroupCredNewIds" /></td>
                      <td>{{ c.name }}</td>
                      <td>{{ c.username }}</td>
                      <td><span class="tag tag-xs" :class="c.auth_type==='password'?'tag-success':'tag-platform'">{{ c.auth_type==='password'?'密码':'私钥' }}</span></td>
                    </tr>
                  </tbody></table>
                </div>
                <div style="text-align:right">
                  <button class="btn btn-primary btn-sm" @click="addBastionGroupCred" :disabled="bastionGroupCredNewIds.length === 0">授权({{ bastionGroupCredNewIds.length }})</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- 堡垒机连接弹窗（目录式下拉风格） -->
      <div class="modal-overlay animated" :class="{ open: bastionConnectVisible }">
        <div class="modal bastion-connect-modal" style="width:680px">  // style="width:740px;min-height:300px"
          <div class="modal-header"><h2>SSH 连接</h2><button class="btn-close" @click="bastionConnectVisible = false">&times;</button></div>
          <div class="modal-body">
            <!-- 目标主机卡片 -->
            <div class="bastion-host-card">
              <div class="bastion-host-card-label">目标主机</div>
              <div class="bastion-host-card-name">{{ bastionConnectAsset.name }}</div>
            </div>
            <!-- 网络类型 -->
            <div class="form-group" style="margin-bottom:20px">
              <label class="bastion-section-label">网络类型</label>
              <div style="display:flex;flex-direction:column;gap:10px">
                <label class="bastion-ip-card" :class="{ active: bastionConnectNetwork === 'public' }" v-if="bastionConnectAsset.public_ip">
                  <input type="radio" v-model="bastionConnectNetwork" value="public" style="display:none" />
                  <div class="bastion-ip-card-tag">公网</div>
                  <div class="bastion-ip-card-addr">{{ bastionConnectAsset.public_ip }}</div>
                </label>
                <label class="bastion-ip-card" :class="{ active: bastionConnectNetwork === 'private' }" v-if="bastionConnectAsset.private_ip">
                  <input type="radio" v-model="bastionConnectNetwork" value="private" style="display:none" />
                  <div class="bastion-ip-card-tag">内网</div>
                  <div class="bastion-ip-card-addr">{{ bastionConnectAsset.private_ip }}</div>
                </label>
                <label class="bastion-ip-card" :class="{ active: bastionConnectNetwork === 'eip' }" v-if="bastionConnectAsset.eip">
                  <input type="radio" v-model="bastionConnectNetwork" value="eip" style="display:none" />
                  <div class="bastion-ip-card-tag">弹性</div>
                  <div class="bastion-ip-card-addr">{{ bastionConnectAsset.eip }}</div>
                </label>
              </div>
            </div>
            <!-- 账号凭证 — 目录式下拉 -->
            <div class="form-group">
              <label class="bastion-section-label">账号凭证</label>
              <div class="bastion-cust-sel" :class="{ active: bastionConnectCredDrpOpen }">
                <div class="bastion-cust-sel-trigger" @click.stop="bastionConnectCredDrpOpen=!bastionConnectCredDrpOpen;bastionNetDrpOpen=false;bastionCredDrpOpen=false">
                  {{ selCredLabel(bastionConnectCredList, bastionConnectCredId) }}
                  <span class="bastion-cust-sel-arrow">▼</span>
                </div>
                <div class="bastion-cust-sel-drop" :class="{ open: bastionConnectCredDrpOpen }" @wheel.stop>
                  <div v-if="bastionConnectCredList.length===0" class="bastion-cust-sel-empty">暂无可用凭证，请先授权该资产给当前用户</div>
                  <div class="bastion-cust-sel-item" v-for="c in bastionConnectCredList" :key="c.id" :class="{sel:bastionConnectCredId===c.id}" @click.stop="bastionConnectCredId=c.id;bastionConnectCredDrpOpen=false">🔑 {{ c.name }}({{ c.username }})</div>
                </div>
              </div>
            </div>
            <!-- 操作按钮 -->
            <div class="bastion-connect-actions">
              <button class="btn btn-default bastion-connect-btn" @click="bastionConnectVisible = false">取消</button>
              <button class="btn btn-primary bastion-connect-btn" @click="doConnectBastion" :disabled="!bastionConnectCredId">连接</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ECS手动添加编辑弹窗 -->
      <div class="modal-overlay" v-if="ecsManualModalVisible">
        <div class="modal">
          <div class="modal-header"><h2>{{ ecsManualEditing ? '编辑实例' : '手动添加实例' }}</h2><button class="btn-close" @click="ecsManualModalVisible = false">&times;</button></div>
          <div class="modal-body">
            <div class="form-vertical">
              <div class="form-group"><label>实例名称 <span class="text-danger">*</span></label><input type="text" class="input input-full" v-model="ecsManualForm.instance_name" placeholder="如 Web服务器" /></div>
              <div class="form-group"><label>公网IP</label><input type="text" class="input input-full" v-model="ecsManualForm.public_ip" placeholder="如 1.2.3.4" /></div>
              <div class="form-group"><label>弹性IP</label><input type="text" class="input input-full" v-model="ecsManualForm.eip" placeholder="如 47.2.68.x（EIP 绑定地址）" /></div>
              <div class="form-group"><label>内网IP</label><input type="text" class="input input-full" v-model="ecsManualForm.private_ip" placeholder="如 10.0.0.1" /></div>
              <div class="form-group"><label>SSH 端口</label><input type="number" min="1" max="65535" class="input input-full" v-model.number="ecsManualForm.ssh_port" placeholder="默认 22，堡垒机连接使用" /></div>
              <div class="form-row-2"><div class="form-group"><label>规格</label><input type="text" class="input input-full" v-model="ecsManualForm.instance_type" placeholder="如 ecs.g7.xlarge" /></div><div class="form-group"><label>平台</label><input type="text" class="input input-full" v-model="ecsManualForm.platform" placeholder="如 aliyun" /></div></div>
              <div class="form-row-2"><div class="form-group"><label>CPU</label><input type="number" class="input input-full" v-model.number="ecsManualForm.cpu" placeholder="核数" /></div><div class="form-group"><label>内存(GB)</label><input type="number" class="input input-full" v-model.number="ecsManualForm.memory" placeholder="GB" /></div></div>
              <div class="form-group"><label>操作系统</label><input type="text" class="input input-full" v-model="ecsManualForm.os_name" placeholder="如 CentOS 7.9" /></div>
              <div class="form-row-2"><div class="form-group"><label>地域</label><input type="text" class="input input-full" v-model="ecsManualForm.region_name" placeholder="如 上海" /></div><div class="form-group"><label>可用区</label><input type="text" class="input input-full" v-model="ecsManualForm.zone_name" placeholder="如 上海可用区B" /></div></div>
              <div class="form-group"><label>账号</label><input type="text" class="input input-full" v-model="ecsManualForm.account_name" placeholder="账号名" /></div>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px">
              <button class="btn btn-default" @click="ecsManualModalVisible = false">取消</button>
              <button class="btn btn-primary" @click="saveEcsManual" :disabled="ecsManualSaving">{{ ecsManualSaving ? '保存中...' : '保存' }}</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 域名（注册列表）手动添加编辑弹窗 -->
      <div class="modal-overlay" v-if="domainManualModalVisible">
        <div class="modal">
          <div class="modal-header"><h2>{{ domainManualEditing ? '编辑域名' : '手动添加域名' }}</h2><button class="btn-close" @click="domainManualModalVisible = false">&times;</button></div>
          <div class="modal-body">
            <div class="form-vertical">
              <div class="form-group"><label>域名 <span class="text-danger">*</span></label><input type="text" class="input input-full" v-model="domainManualForm.domain_name" placeholder="如 example.com" :disabled="domainManualEditing" /></div>
              <div class="form-row-2"><div class="form-group"><label>平台</label><input type="text" class="input input-full" v-model="domainManualForm.platform" placeholder="如 aliyun / other" /></div><div class="form-group"><label>账号名</label><input type="text" class="input input-full" v-model="domainManualForm.account_name" placeholder="如 其它平台/手动录入" /></div></div>
              <div class="form-group"><label>所有者</label><input type="text" class="input input-full" v-model="domainManualForm.owner" placeholder="域名所有者" /></div>
              <div class="form-row-2"><div class="form-group"><label>注册日期</label><input type="date" class="input input-full" v-model="domainManualForm.registration_date" /></div><div class="form-group"><label>到期日期</label><input type="date" class="input input-full" v-model="domainManualForm.expiration_date" /></div></div>
              <div class="form-group"><label class="checkbox-inline"><input type="checkbox" v-model="domainManualForm.auto_renew_enabled" /> 自动续费已开启</label></div>
              <div class="form-group"><label>备注</label><input type="text" class="input input-full" v-model="domainManualForm.remark" placeholder="备注信息" /></div>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px">
              <button class="btn btn-default" @click="domainManualModalVisible = false">取消</button>
              <button class="btn btn-primary" @click="saveDomainManual" :disabled="domainManualSaving">{{ domainManualSaving ? '保存中...' : '保存' }}</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 堡垒机凭证编辑弹窗 -->
      <div class="modal-overlay" v-if="bastionCredModalVisible">
        <div class="modal">
          <div class="modal-header"><h2>{{ bastionCredEditing ? '编辑凭证' : '新增凭证' }}</h2><button class="btn-close" @click="bastionCredModalVisible = false">&times;</button></div>
          <div class="modal-body">
            <div class="form-vertical">
              <div class="form-group"><label>凭证名称 <span class="text-danger">*</span></label><input type="text" class="input input-full" v-model="bastionCredForm.name" placeholder="如 生产环境root" /></div>
              <div class="form-group"><label>用户名 <span class="text-danger">*</span></label><input type="text" class="input input-full" v-model="bastionCredForm.username" placeholder="如 root" /></div>
              <div class="form-group"><label>认证方式</label><select class="select" style="width:100%" v-model="bastionCredForm.auth_type"><option value="password">密码</option><option value="private_key">私钥</option></select></div>
              <div class="form-group" v-if="bastionCredForm.auth_type === 'password'">
                <label>密码 <span v-if="!bastionCredEditing" class="text-danger">*</span><span v-else class="text-gray" style="font-weight:400">（留空不修改）</span></label>
                <input type="password" class="input input-full" v-model="bastionCredForm.password" placeholder="SSH密码" />
              </div>
              <template v-if="bastionCredForm.auth_type === 'private_key'">
                <div class="form-group"><label>私钥 <span v-if="!bastionCredEditing" class="text-danger">*</span><span v-else class="text-gray" style="font-weight:400">（留空不修改）</span></label><textarea class="input input-full" v-model="bastionCredForm.private_key" placeholder="SSH私钥" rows="5" style="resize:vertical;font-family:monospace;font-size:12px;"></textarea></div>
                <div class="form-group"><label>私钥密码（可选）</label><input type="password" class="input input-full" v-model="bastionCredForm.passphrase" placeholder="私钥密码" /></div>
              </template>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px">
              <button class="btn btn-default" @click="bastionCredModalVisible = false">取消</button>
              <button class="btn btn-primary" @click="saveBastionCred" :disabled="bastionCredSaving">{{ bastionCredSaving ? '保存中...' : '保存' }}</button>
            </div>
          </div>
        </div>
      </div>

    </template>

    <div class="toast" :class="{ show: toast.show, 'toast-success': toast.type === 'success', 'toast-error': toast.type === 'error' }">{{ toast.msg }}</div>

    <!-- 同步进度日志面板 -->
  <div v-if="bastionNetDrpOpen||bastionCredDrpOpen||bastionConnectCredDrpOpen" class="drp-backdrop" @click="bastionNetDrpOpen=false;bastionCredDrpOpen=false;bastionConnectCredDrpOpen=false" @wheel.prevent></div>
  </div>

  <script src="/assets/js/app.js?v=20261111a"></script>
</body>
</html>
