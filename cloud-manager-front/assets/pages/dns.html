<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DNS解析 - 云管平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>" />
  <script src="/assets/js/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css?v=20261109n" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="page-template">
    <div class="dns-page">
      <div class="page-header">
        <h2>DNS解析</h2>
        <div class="sync-btn-group">
          <button class="btn btn-primary btn-sm" @click="openSync">同步DNS域名</button>
        </div>
      </div>

      <div class="cdn-layout">
        <aside class="cdn-drawer nav-dir">
          <div class="nav-dir-head"><span class="nav-dir-title">选择账号</span></div>
          <div class="nav-dir-search">
            <i class="fas fa-search"></i>
            <input type="text" class="nav-dir-search-input" v-model="navDirKeyword" placeholder="输入平台或账号实时筛选" autocomplete="off" />
            <button v-if="navDirKeyword" class="nav-dir-search-clear" type="button" title="清空" @click.stop="navDirKeyword = ''">✕</button>
          </div>
          <div class="cdn-drawer-title">筛选</div>
          <button class="cdn-drawer-item" :class="{ active: !filters.platform && !filters.account }" @click="selectFilter('', '')">全部域名</button>
          <template v-for="pf in filteredPlatforms" :key="pf">
            <div class="cdn-drawer-group" :class="{ active: filters.platform === pf && !filters.account }" @click="selectFilter(pf, '')">{{ platformLabel(pf) }}</div>
            <button v-for="acc in accountsOfPlatform(pf)" :key="pf + '-' + acc" class="cdn-drawer-item sub-2" :class="{ active: filters.account === acc }" @click="selectFilter(pf, acc)" :title="acc">{{ acc }}</button>
          </template>
        </aside>

        <div class="cdn-main">
          <div class="filter-bar">
            <div class="filter-row">
              <input type="text" class="input" placeholder="搜索域名..." v-model="filters.keyword" @input="onKeywordInput" />
              <button class="btn btn-default" @click="resetFilters">重置</button>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="table table-fixed dns-table dns-domain-table">
              <thead>
                <tr>
                  <th>域名</th>
                  <th>平台</th>
                  <th>账号</th>
                  <th>平台解析</th>
                  <th>版本</th>
                  <th>解析记录数</th>
                  <th>DNS服务器</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-if="loading"><td colspan="9" class="text-center py-40">加载中...</td></tr>
                <tr v-else-if="list.length === 0"><td colspan="9" class="text-center py-40 text-gray">暂无数据，请先同步域名</td></tr>
                <tr v-for="item in list" :key="item.id">
                  <td><a class="domain-link" :title="item.domain_name" @click="openResolve(item)">{{ item.domain_name }}</a></td>
                  <td><span class="tag tag-platform">{{ platformLabel(item.platform) }}</span></td>
                  <td>{{ item.account_name }}</td>
                  <td><span :class="item.ali_domain ? 'tag tag-success' : 'tag tag-default'">{{ item.ali_domain ? '是' : '否' }}</span></td>
                  <td><span :class="item.starmark ? 'tag tag-success' : 'tag tag-default'">{{ item.starmark ? '正式版' : '免费版' }}</span></td>
                  <td>{{ item.record_count }}</td>
                  <td class="text-sm text-mono" :title="item.dns_servers">{{ item.dns_servers || '-' }}</td>
                  <td class="text-sm">{{ formatDateTime(item.create_time) }}</td>
                  <td>
                    <button class="btn btn-text btn-sm" @click="openResolve(item)">解析</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination">
            <span class="page-info">共 {{ total }} 条</span>
            <div class="page-btns">
              <button class="btn btn-default btn-sm" :disabled="page <= 1" @click="goPage(1)">首页</button>
              <button class="btn btn-default btn-sm" :disabled="page <= 1" @click="goPage(page - 1)">上一页</button>
              <span class="page-jump">
                第 <input type="number" class="input input-page" v-model.number="pageInput" @keyup.enter="jumpPage" min="1" :max="totalPages" /> / {{ totalPages }} 页
              </span>
              <button class="btn btn-default btn-sm" :disabled="page >= totalPages" @click="goPage(page + 1)">下一页</button>
              <button class="btn btn-default btn-sm" :disabled="page >= totalPages" @click="goPage(totalPages)">末页</button>
            </div>
            <div class="page-size">
              每页
              <select class="select select-sm" v-model.number="size" @change="onSizeChange">
                <option :value="10">10</option>
                <option :value="20">20</option>
                <option :value="50">50</option>
                <option :value="100">100</option>
              </select>
              条
            </div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script src="/assets/js/core.js?v=20261109f"></script>
  <script src="/assets/js/shared-sync.js?v=20261109l"></script>
  <script src="/assets/js/pages/dns.js?v=20261109m"></script>
</body>
</html>
