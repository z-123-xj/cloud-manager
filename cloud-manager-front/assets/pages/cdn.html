<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CDN域名 - 云管平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>" />
  <script src="/assets/js/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css?v=20261109n" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* 表格前 11 列列宽复用 style.css 的 .cdn-table 规则，本页额外保留「创建时间」列 */
    .cdn-table th:nth-child(12), .cdn-table td:nth-child(12) { width: 150px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="page-template">
    <div class="cdn-page">
      <div class="page-header">
        <h2>CDN域名</h2>
        <div class="sync-btn-group">
          <button class="btn btn-primary btn-sm" @click="openSync">同步CDN域名</button>
        </div>
      </div>

      <div class="cdn-layout">
        <aside class="cdn-drawer nav-dir">
          <div class="nav-dir-head"><span class="nav-dir-title">选择账号</span></div>
          <div class="nav-dir-search">
            <i class="fas fa-search"></i>
            <input type="text" class="nav-dir-search-input" v-model="navDirKeyword" placeholder="输入平台或账号实时筛选" autocomplete="off" />
            <button v-if="navDirKeyword" class="nav-dir-search-clear" type="button" title="清空" @click.stop="navDirKeyword = ''">✕</button>
          </div>
          <div class="cdn-drawer-title">筛选</div>
          <button class="cdn-drawer-item" :class="{ active: !filters.platform && !filters.account }" @click="selectFilter('', '')">全部域名</button>
          <template v-for="pf in filteredPlatforms" :key="pf">
            <div class="cdn-drawer-group" :class="{ active: filters.platform === pf && !filters.account }" @click="selectFilter(pf, '')">{{ platformLabel(pf) }}</div>
            <button v-for="acc in accountsOfPlatform(pf)" :key="pf + '-' + acc" class="cdn-drawer-item sub-2" :class="{ active: filters.account === acc }" @click="selectFilter(pf, acc)" :title="acc">{{ acc }}</button>
          </template>
        </aside>

        <div class="cdn-main">
          <div class="filter-bar">
            <div class="filter-row">
              <input type="text" class="input" placeholder="搜索加速域名 / 源站 / 账户名..." v-model="filters.keyword" @input="onKeywordInput" />
              <select class="select" v-model="filters.status" @change="search">
                <option value="">状态:全部</option>
                <option value="运行中">运行中</option>
                <option value="已停止">已停止</option>
                <option value="配置中">配置中</option>
                <option value="审核中">审核中</option>
                <option value="审核未通过">审核未通过</option>
                <option value="配置失败">配置失败</option>
                <option value="删除中">删除中</option>
              </select>
              <button class="btn btn-default" @click="resetFilters">重置</button>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="table table-fixed cdn-table">
              <thead>
                <tr>
                  <th>加速域名</th>
                  <th>CNAME</th>
                  <th>平台</th>
                  <th>产品</th>
                  <th>账号</th>
                  <th>状态</th>
                  <th>业务类型</th>
                  <th>源站</th>
                  <th>HTTPS</th>
                  <th>证书到期</th>
                  <th>SSL剩余 <span class="sort-icon" @click="toggleSslSort">{{ sslSortIcon }}</span></th>
                  <th>创建时间</th>
                </tr>
              </thead>
              <tbody>
                <tr v-if="loading"><td colspan="12" class="text-center py-40">加载中...</td></tr>
                <tr v-else-if="list.length === 0"><td colspan="12" class="text-center py-40 text-gray">暂无数据，请先同步CDN域名</td></tr>
                <tr v-for="item in sortedList" :key="item.id">
                  <td class="cdn-domain-cell">
                    {{ item.domain_name }}
                    <span v-if="item.aliases && item.aliases.split(',').length > 1" class="tag tag-default" style="margin-left:6px;font-size:11px;" :title="'全部备用域名: ' + item.aliases">+{{ item.aliases.split(',').length - 1 }}</span>
                  </td>
                  <td class="cdn-cname-cell" :title="item.cname">{{ item.cname || '-' }}</td>
                  <td><span class="tag tag-platform">{{ platformLabel(item.platform) }}</span></td>
                  <td><span class="tag" :class="productClass(item.product)">{{ productLabel(item.product) }}</span></td>
                  <td>{{ item.account_name }}</td>
                  <td><span :class="statusClass(item.status)">{{ item.status || '-' }}</span></td>
                  <td>{{ item.biz_type || '-' }}</td>
                  <td class="text-sm text-mono" style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" :title="item.origin_domain">{{ item.origin_domain || '-' }}</td>
                  <td><span :class="item.https_on ? 'cdn-https-on' : 'cdn-https-off'">{{ item.https_on ? '已开启' : '未开启' }}</span></td>
                  <td class="cdn-cert-expire">{{ item.cert_expire_time || '-' }}</td>
                  <td>
                    <span v-if="sslDaysLeft(item.cert_expire_time) === null" class="text-gray">-</span>
                    <span v-else :style="{ color: sslDaysLeft(item.cert_expire_time) <= 0 ? '#e53e3e' : (sslDaysLeft(item.cert_expire_time) <= 14 ? '#dd6b20' : '#2f855a') }">
                      {{ sslDaysLeft(item.cert_expire_time) }} 天
                    </span>
                  </td>
                  <td class="text-sm">{{ formatDateTime(item.created_at) }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination">
            <span class="page-info">共 {{ total }} 条</span>
            <div class="page-btns">
              <button class="btn btn-default btn-sm" :disabled="page <= 1" @click="goPage(1)">首页</button>
              <button class="btn btn-default btn-sm" :disabled="page <= 1" @click="goPage(page - 1)">上一页</button>
              <span class="page-jump">
                第 <input type="number" class="input input-page" v-model.number="pageInput" @keyup.enter="jumpPage" min="1" :max="totalPages" /> / {{ totalPages }} 页
              </span>
              <button class="btn btn-default btn-sm" :disabled="page >= totalPages" @click="goPage(page + 1)">下一页</button>
              <button class="btn btn-default btn-sm" :disabled="page >= totalPages" @click="goPage(totalPages)">末页</button>
            </div>
            <div class="page-size">
              每页
              <select class="select select-sm" v-model.number="size" @change="onSizeChange">
                <option :value="10">10</option>
                <option :value="20">20</option>
                <option :value="50">50</option>
                <option :value="100">100</option>
              </select>
              条
            </div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script src="/assets/js/core.js?v=20261109f"></script>
  <script src="/assets/js/shared-sync.js?v=20261109l"></script>
  <script src="/assets/js/pages/cdn.js?v=20261108k"></script>
</body>
</html>
