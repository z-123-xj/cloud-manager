# ============================================================
# 云管平台 Nginx 公共规则（server 上下文 include）
#
# 生产 / 本地 Docker 共用这一份，避免两处规则漂移。
# 上游统一命名为 cloud_backend，由各环境的 vhost 定义：
#   生产     -> 127.0.0.1:8080
#   本地容器 -> host.docker.internal:8080（宿主机上的 Go 后端）
#
# 部署时把整个 deploy/ 目录放到 /etc/nginx/cloud-manager/，
# vhost 里用 include /etc/nginx/cloud-manager/nginx.common.conf; 引入。
# ============================================================

# 堡垒机 SFTP 分片上传（单片 2MB，留足余量）
client_max_body_size 100m;

# ---- 压缩 ----
gzip on;
gzip_comp_level 5;
gzip_min_length 1k;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    image/svg+xml;

# ---- 隐藏文件：禁止通过 Web 访问仓库的 .git / .env 等 ----
location ~ /\.(?!well-known) {
    deny all;
}

# ---- 部署配置目录：不允许通过 Web 读取 ----
# root 指向整个前端仓库，deploy/ 内含 vhost / 启动脚本 / systemd 单元
location ^~ /deploy/ {
    deny all;
}

# ---- 独立页面 HTML：禁止长缓存 ----
# 页面拆成独立 HTML 后统一命中此规则，避免被 /assets/ 的 7d 缓存吃掉。
# 注意此处不能给 /assets/ 加 ^~ 前缀，否则正则 location 不会生效。
location ~ ^/assets/pages/.*\.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# ---- 静态资源：长缓存（页面引用带 ?v= 版本参数，改后自动刷新）----
location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# ---- 主入口不缓存 ----
location = /index.html {
    add_header Cache-Control "no-store" always;
}

# ---- SPA 路由回退（解析记录 / 用户组 / 凭证等仍是主站伪路由）----
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

# ---- WebSocket：堡垒机终端 /api/bastion/ws/ ----
location /api/bastion/ws/ {
    proxy_pass http://cloud_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 终端会话长连接保活
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# ---- API：其余请求全部转发后端（同源，无跨域）----
location /api/ {
    proxy_pass http://cloud_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE：同步进度 /api/sync/progress 实时推送，必须关闭缓冲
    proxy_buffering off;
    proxy_cache    off;

    # SFTP 大文件上传 / 下载：关闭请求缓冲 + 放宽超时
    proxy_request_buffering off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}
