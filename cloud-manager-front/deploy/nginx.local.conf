# ============================================================
# 云管平台 Nginx vhost（本地 Docker）
#
# 由 deploy/start.ps1 挂载到容器 /etc/nginx/conf.d/default.conf，
# 同时把整个 deploy/ 挂到 /etc/nginx/cloud-manager/ 供 include。
# 宿主机访问：http://localhost:8081
#
# 与生产版（nginx.conf）唯一差异：上游指向宿主机、root 指向 bind mount、
# server_name 为 localhost。其余规则全部来自 nginx.common.conf。
# ============================================================

upstream cloud_backend {
    # host.docker.internal 由 start.ps1 的 --add-host ... host-gateway 提供
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name localhost;

    # bind mount 宿主机的 cloud-manager-front 目录，改文件刷新浏览器即生效
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/cloud-manager/nginx.common.conf;
}
