# ============================================================
# 云管平台 Nginx vhost（生产）
#
# 架构：Nginx 直接托管前端静态文件（root），
#       仅将 /api/ 反向代理到 Go 后端，静态与 API 同源。
#
# 部署：
#   1. 把整个 deploy/ 目录放到 /etc/nginx/cloud-manager/
#      （cloud-manager-front 仓库自带该目录，随前端代码一起发布）
#   2. 本文件放到 /etc/nginx/conf.d/cloud-manager.conf
#      （Debian/Ubuntu 也可放 sites-available/ 再软链到 sites-enabled/）
#   3. 修改 server_name 为实际域名 / IP
#   4. 确认 root 指向 cloud-manager-front 部署目录
#      （/opt/cloud-manager/ 对应仓库的 cloud-manager/ 项目目录，两仓库同级）
#   5. 确认下方 upstream 与 config.yaml 的 server.port 一致
#   6. nginx -t && systemctl reload nginx
#
# 公共规则在 nginx.common.conf，本地 Docker 版（nginx.local.conf）共用之。
# ============================================================

upstream cloud_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name cloud.example.com;   # TODO: 改为实际域名 / IP

    root  /opt/cloud-manager/cloud-manager-front;
    index index.html;

    include /etc/nginx/cloud-manager/nginx.common.conf;
}

